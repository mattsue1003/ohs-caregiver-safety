<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta property="og:title" content="職業安全與衛生：照顧服務人員的自我保護與勞動權益"><meta name="description" content="鍾孟修 職能治療師｜長照、日照、身障單位工作人員與居服員 3 小時網頁簡報：安全轉移位、勞動權益與法定通報、四大危害、受傷之後"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>安心小島 職業安全與衛生</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700;900&family=Fredoka:wght@500;600;700&display=swap">
<style>
/* Layout: full-window sunny 3D island (three.js) behind a 1600x900 scaled UI stage; slide cards sit right, the car parks at each chapter's landmark on the left. */
:root{
  --ink:#22304a; --ink2:#4a5874; --paper:#fffdf8; --line:#e6e1d6;
  --sky1:#bfe4ff; --sky2:#fff3da;
  --c0:#f2558f; --c1:#ef5a5a; --c2:#3d6fe0; --c3:#e9a100; --c4:#7c4fe0; --c5:#0f9a9a;
  --ok:#1f9d63; --bad:#d9433f;
  --fh:'Huninn','Noto Sans TC','PingFang TC',sans-serif;
  --fb:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
  --fn:'Fredoka','Huninn',sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:linear-gradient(180deg,var(--sky1) 0%,#e4f4ff 55%,var(--sky2) 100%);color:var(--ink);font-family:var(--fb);overflow:hidden;-webkit-font-smoothing:antialiased}
#world{position:fixed;inset:0;width:100vw;height:100vh;display:block;touch-action:none}
#ui{position:fixed;left:0;top:0;width:1600px;height:900px;transform-origin:0 0;pointer-events:none}
#ui *{box-sizing:border-box}
button{font-family:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--c2);outline-offset:2px}

/* top bar */
.top{z-index:2;position:absolute;left:36px;top:26px;right:36px;display:flex;align-items:center;gap:18px;pointer-events:none}
.brand{pointer-events:auto;background:var(--paper);border-radius:999px;padding:10px 20px 10px 14px;display:flex;align-items:center;gap:10px;font-family:var(--fh);font-size:20px;box-shadow:0 4px 0 rgba(34,48,74,.12)}
.brand i{width:26px;height:26px;border-radius:50%;background:conic-gradient(var(--c0),var(--c1),var(--c3),var(--c5),var(--c2),var(--c4),var(--c0));display:block}
.chips{display:flex;gap:8px;pointer-events:auto}
.chip{border:0;background:rgba(255,253,248,.78);border-radius:999px;padding:8px 16px;font-family:var(--fh);font-size:18px;color:var(--ink2);display:flex;align-items:center;gap:8px;transition:background .2s,transform .2s}
.chip b{width:12px;height:12px;border-radius:50%;background:var(--cc)}
.chip.on{background:var(--paper);color:var(--ink);transform:translateY(-2px);box-shadow:0 4px 0 color-mix(in srgb,var(--cc) 45%,transparent)}
.chip:hover{background:var(--paper)}

/* slides */
#deck{position:absolute;inset:0}
.slide{position:absolute;inset:0;display:none}
.slide.on{display:block}
.card{pointer-events:auto;position:absolute;left:600px;top:96px;width:960px;height:742px;background:var(--paper);border-radius:30px;padding:34px 44px 30px;display:flex;flex-direction:column;gap:14px;box-shadow:0 10px 0 color-mix(in srgb,var(--cc) 28%,transparent),0 24px 60px rgba(34,48,74,.16);--tint:color-mix(in srgb,var(--cc) 11%,#fff);--tint2:color-mix(in srgb,var(--cc) 22%,#fff)}
.slide.wide .card{left:70px;width:1460px}
.slide.on .card{animation:pop .5s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{from{opacity:0;transform:translateY(26px) scale(.97)}to{opacity:1;transform:none}}
.tag{align-self:flex-start;background:var(--cc);color:#fff;font-family:var(--fh);font-size:17px;padding:5px 14px;border-radius:999px;letter-spacing:.04em}
.slide[data-ch="2"] .tag{color:var(--ink)}
.card h2{margin:0;font-family:var(--fh);font-weight:400;font-size:48px;line-height:1.15;text-wrap:balance}
.lead{margin:-4px 0 0;font-size:22px;color:var(--ink2);line-height:1.5}
.bd{flex:1;min-height:0;display:flex;flex-direction:column;gap:16px;font-size:22px;line-height:1.5}
.src{font-size:14px;color:#7a8399;line-height:1.4}
.src a{color:inherit}
.grid{flex:1;display:grid;gap:16px;min-height:0}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g5{grid-template-columns:repeat(5,1fr)}
.tile{background:var(--tint);border-radius:20px;padding:18px 22px;display:flex;flex-direction:column;justify-content:space-evenly;gap:6px;min-width:0}
.tile h3{margin:0;font-family:var(--fh);font-weight:400;font-size:31px;line-height:1.25}
.tile p{margin:0;font-size:22px;line-height:1.55}
.tile ul.dots{font-size:22px}
.tile .k{font-family:var(--fn);font-weight:600;font-size:17px;letter-spacing:.08em;color:color-mix(in srgb,var(--cc) 80%,var(--ink));text-transform:uppercase}
.tile.solid{background:var(--cc);color:#fff}
.slide[data-ch="2"] .tile.solid{color:var(--ink)}
.tile.solid .k{color:inherit;opacity:.8}
.tight .pill{font-size:.82em;padding:2px 11px}.tight .tile p{font-size:20.5px}.tight .tile h3{font-size:28px}
.hl{background:linear-gradient(transparent 58%,color-mix(in srgb,var(--cc) 30%,transparent) 58%);padding:0 2px}
.big{font-family:var(--fn);font-weight:700;color:var(--cc);line-height:1}
.pill{display:inline-block;background:var(--tint2);border-radius:999px;padding:3px 14px;font-size:.92em;margin:3px 5px 3px 0}
ul.dots{margin:0;padding-left:1.1em}
ul.dots li{margin:2px 0}
.row{display:flex;gap:16px;min-height:0}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
.f1{flex:1}
.note{background:#fff6dc;border-radius:16px;padding:12px 18px;font-size:19px;line-height:1.5}
.tbl{flex:1;width:100%;border-collapse:separate;border-spacing:0;font-size:21px;line-height:1.45}
.tbl th{font-family:var(--fh);font-weight:400;font-size:22px;text-align:left;background:var(--cc);color:#fff;padding:10px 16px}
.slide[data-ch="2"] .tbl th{color:var(--ink)}
.tbl th:first-child{border-radius:14px 0 0 0}.tbl th:last-child{border-radius:0 14px 0 0}
.tbl td{padding:7px 16px;border-bottom:2px solid var(--line);vertical-align:middle}
.tbl tr:nth-child(even) td{background:var(--tint)}
.tbl td:first-child{font-family:var(--fh);font-size:22px;white-space:nowrap}
.btn{border:0;background:var(--ink);color:#fff;border-radius:999px;padding:10px 22px;font-size:20px;font-family:var(--fh);box-shadow:0 4px 0 rgba(0,0,0,.18);transition:transform .12s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.btn.alt{background:var(--tint2);color:var(--ink)}
.btn.cc{background:var(--cc)}
.seg{display:inline-flex;background:var(--tint);border-radius:999px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;border-radius:999px;padding:6px 16px;font-size:18px;font-family:var(--fh);color:var(--ink2)}
.seg button.on{background:var(--paper);color:var(--ink);box-shadow:0 2px 0 rgba(34,48,74,.15)}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-7px)}50%{transform:translateX(7px)}75%{transform:translateX(-4px)}}

/* cover */
.slide.cover::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,253,248,.9) 0,rgba(255,253,248,.72) 40%,rgba(255,253,248,0) 62%);pointer-events:none}
body.mob .slide.cover::before{display:none}
.slide.cover .card{left:64px;top:118px;width:820px;height:auto;background:transparent;box-shadow:none;padding:0;gap:20px;animation:none}
.cover .kicker{font-family:var(--fh);font-size:26px;background:var(--paper);align-self:flex-start;padding:8px 22px;border-radius:999px;box-shadow:0 5px 0 rgba(34,48,74,.12)}
.cover h1{margin:0;font-family:var(--fh);font-weight:400;font-size:112px;line-height:1.06;color:var(--ink);text-shadow:0 6px 0 #fff,0 0 1px #fff;letter-spacing:.01em}
.cover h1 span{display:block;font-size:70px;color:var(--c2);margin-top:10px}
.cover .meta{display:flex;gap:18px;align-items:stretch;margin-top:14px}
.cover .who{background:var(--paper);border-radius:24px;padding:20px 26px;font-size:22px;line-height:1.6;box-shadow:0 6px 0 rgba(34,48,74,.12)}
.cover .who b{font-family:var(--fh);font-weight:400;font-size:28px}
.cover .qr{background:var(--paper);border-radius:24px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:15px;box-shadow:0 6px 0 rgba(34,48,74,.12)}
.cover .qr img{width:132px;height:132px;image-rendering:pixelated}
.cover .hint{font-family:var(--fh);font-size:21px;color:var(--ink2);display:flex;gap:10px;align-items:center}
kbd{font-family:var(--fn);background:var(--paper);border-radius:8px;padding:2px 10px;box-shadow:0 3px 0 rgba(34,48,74,.2);font-size:.9em}

/* bottom bar */
.bar{position:absolute;right:40px;bottom:16px;display:flex;gap:10px;align-items:center;pointer-events:auto}
.bar button{border:0;background:var(--paper);border-radius:999px;height:46px;min-width:46px;padding:0 16px;font-family:var(--fh);font-size:18px;color:var(--ink);box-shadow:0 4px 0 rgba(34,48,74,.14)}
.bar .num{font-family:var(--fn);font-weight:600;font-size:19px;background:var(--paper);border-radius:999px;padding:9px 16px;box-shadow:0 4px 0 rgba(34,48,74,.14)}
.bar .drive{background:var(--ink);color:#fff}
.progress{position:absolute;left:0;right:0;bottom:0;height:6px;background:rgba(255,255,255,.5)}
.progress i{display:block;height:100%;background:var(--ink);width:0;transition:width .4s}

/* drive HUD */
#hud{position:absolute;left:36px;bottom:24px;display:none;gap:14px;align-items:flex-end;pointer-events:auto}
body.driving #hud{display:flex}
body.driving #deck{display:none}
.hudbox{background:var(--paper);border-radius:22px;padding:14px 20px;font-size:19px;line-height:1.6;box-shadow:0 5px 0 rgba(34,48,74,.14)}
.hudbox b{font-family:var(--fh);font-weight:400;font-size:24px}
#near{position:absolute;left:0;bottom:118px;white-space:nowrap;display:none;background:var(--ink);color:#fff;border:0;border-radius:22px;padding:16px 24px;font-family:var(--fh);font-size:24px;box-shadow:0 5px 0 rgba(0,0,0,.2)}
.pad{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,64px);gap:8px}
.pad button{border:0;border-radius:18px;background:var(--paper);font-size:26px;box-shadow:0 4px 0 rgba(34,48,74,.14);touch-action:none;user-select:none}

/* toc */
#toc{position:absolute;left:36px;top:90px;width:430px;bottom:80px;background:var(--paper);border-radius:26px;padding:20px;overflow:auto;display:none;pointer-events:auto;box-shadow:0 20px 60px rgba(34,48,74,.2)}
#toc.on{display:block}
#toc h4{margin:12px 0 6px;font-family:var(--fh);font-weight:400;font-size:21px;display:flex;align-items:center;gap:8px}
#toc h4 b{width:12px;height:12px;border-radius:50%;background:var(--cc)}
#toc button{display:block;width:100%;text-align:left;border:0;background:transparent;border-radius:10px;padding:6px 10px;font-size:17px;color:var(--ink2)}
#toc button:hover,#toc button.on{background:#f1ede4;color:var(--ink)}

/* components */
.agenda{flex:1;display:flex;flex-direction:column;justify-content:space-between;gap:10px}
.agenda .it{display:grid;grid-template-columns:62px 1fr 92px;align-items:center;gap:18px;background:var(--t);border-radius:20px;padding:12px 20px}
.agenda .it .n{width:54px;height:54px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-family:var(--fn);font-weight:700;font-size:26px}
.agenda .it h3{margin:0;font-family:var(--fh);font-weight:400;font-size:28px}
.agenda .it p{margin:0;font-size:19px;color:var(--ink2)}
.agenda .it .m{font-family:var(--fn);font-weight:600;font-size:26px;text-align:right}
.words{flex:1;display:grid;grid-template-columns:repeat(5,1fr);gap:16px}
.word{background:var(--tint);border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-family:var(--fh);font-size:46px;transition:filter .3s}
.word svg{width:96px;height:96px}
.words.hide .word{filter:blur(22px) saturate(0)}
.bars{display:flex;flex-direction:column;gap:12px}
.barrow{display:grid;grid-template-columns:150px 1fr 90px;align-items:center;gap:12px;font-size:20px}
.barrow .tr{height:30px;background:#f1ede4;border-radius:999px;overflow:hidden}
.barrow .tr i{display:block;height:100%;background:var(--cc);border-radius:999px}
.barrow .v{font-family:var(--fn);font-weight:600;text-align:right}
.spectrum{display:grid;grid-template-columns:1fr 1fr 1.6fr;border-radius:18px;overflow:hidden;font-family:var(--fh);font-size:22px;text-align:center}
.spectrum div{padding:12px 8px}
.flipq{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.fq{background:var(--tint);border-radius:20px;padding:16px 18px;display:flex;flex-direction:column;justify-content:space-between;gap:10px;font-size:20px;line-height:1.45}
.fq .ans{display:flex;gap:8px}
.fq .ans button{flex:1;border:0;border-radius:14px;padding:10px;font-family:var(--fh);font-size:19px;background:var(--paper);color:var(--ink)}
.fq.done .ans button.right{background:var(--ok);color:#fff}
.fq.done .ans button.wrongpick{background:var(--bad);color:#fff}
.fq .why{display:none;font-size:17px;color:var(--ink2)}
.fq.done .why{display:block}
.flow{display:flex;align-items:stretch;gap:0;flex:1}
.flow .st{flex:1;background:var(--tint);border-radius:18px;padding:16px 12px;display:flex;flex-direction:column;justify-content:space-evenly;text-align:center;gap:6px;position:relative}
.flow .st h3{margin:0;font-family:var(--fh);font-weight:400;font-size:30px}
.flow .st p{margin:0;font-size:20px;line-height:1.5}
.flow .st .k{font-family:var(--fn);font-weight:700;color:var(--cc);font-size:40px}
.flow .ar{width:26px;display:grid;place-items:center;color:var(--cc);font-size:26px;font-weight:900}
.ad8{flex:1;display:flex;flex-direction:column;justify-content:space-between;gap:6px}
.ad8 .q{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:12px;background:var(--tint);border-radius:14px;padding:3px 8px 3px 14px;font-size:21px}
.ad8 .q .n{font-family:var(--fn);font-weight:700;color:var(--cc);font-size:22px}
.ad8 .seg button{font-size:18px;padding:6px 14px}
.ad8 .seg button.on.yes{background:var(--cc);color:#fff}
.score{display:flex;align-items:center;gap:16px;background:var(--ink);color:#fff;border-radius:18px;padding:12px 20px;font-size:20px}
.score .big{color:#fff;font-size:44px}
.clockwrap{display:grid;grid-template-columns:420px 1fr;gap:22px;flex:1;min-height:0}
.pad2{background:#fff;border:3px dashed var(--tint2);border-radius:24px;position:relative;overflow:hidden}
.pad2 canvas{width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
.errs{display:grid;grid-template-columns:1fr 1fr;gap:12px;flex:1}
.err{background:var(--tint);border-radius:18px;padding:10px 14px;display:flex;gap:14px;align-items:center;font-size:19px;line-height:1.45}
.err svg{width:150px;height:150px;flex:none}
.err b{font-family:var(--fh);font-weight:400;font-size:25px;display:block}
.cues{display:flex;flex-direction:column;gap:8px;flex:1;justify-content:space-between}
.cue{border:0;text-align:left;display:grid;grid-template-columns:44px 1fr;gap:14px;align-items:center;background:var(--tint);border-radius:16px;padding:10px 16px;font-size:23px;color:var(--ink);transition:background .2s}
.cue .n{width:40px;height:40px;border-radius:50%;background:var(--paper);display:grid;place-items:center;font-family:var(--fn);font-weight:700}
.cue.on{background:var(--cc);color:#fff}
.cue.on .n{color:var(--cc)}
.cuebox{background:var(--ink);color:#fff;border-radius:20px;padding:20px 24px;font-size:22px;line-height:1.6;display:flex;flex-direction:column;justify-content:center;gap:10px}
.cuebox .say{font-family:var(--fh);font-size:32px;line-height:1.35}
.npi{display:flex;flex-wrap:wrap;gap:10px}
.npi span{background:#fff;border-radius:999px;padding:8px 18px;font-size:22px}
.calc{display:grid;grid-template-columns:1fr;gap:10px}
.calc label{display:flex;flex-direction:column;gap:4px;font-size:19px;color:inherit}
.calc input{font-family:var(--fn);font-size:28px;font-weight:600;border:2px solid var(--tint2);border-radius:14px;padding:6px 12px;width:100%;color:var(--ink);background:#fff}
.toolchips{display:flex;flex-wrap:wrap;gap:10px}
.toolchips button{border:2px solid var(--tint2);background:#fff;border-radius:999px;padding:12px 24px;font-size:23px;font-family:var(--fh);color:var(--ink)}
.toolchips button.on{background:var(--cc);color:#fff;border-color:var(--cc)}
.toolchips button.rec{box-shadow:0 0 0 4px var(--ok)}
.recbox{flex:1;background:var(--tint);border-radius:18px;padding:16px 22px;font-size:21px;line-height:1.6;display:flex;align-items:center;justify-content:center;color:var(--ink2)}
.recbox.on{display:block;color:var(--ink)}
.cst{flex:1;display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:1fr 1fr;gap:10px}
.cst div{background:var(--tint);border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-family:var(--fh);font-size:21px;line-height:1.3;padding:6px}
.cst div i{font-style:normal;font-family:var(--fn);font-weight:700;color:var(--cc);font-size:18px}
.sr{background:var(--ink);color:#fff;border-radius:24px;padding:20px 24px;display:flex;flex-direction:column;gap:12px;justify-content:space-between}
.sr .ring{width:170px;height:170px;margin:0 auto;position:relative}
.sr .ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.sr .ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--fn);font-size:40px;font-weight:600}
.sr .msg{font-family:var(--fh);font-size:26px;text-align:center;min-height:2.6em;line-height:1.3}
.sr .ladder{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.sr .ladder span{border-radius:999px;padding:3px 10px;background:rgba(255,255,255,.14);font-family:var(--fn);font-size:15px}
.sr .ladder span.on{background:var(--c3);color:var(--ink)}
.sr .ladder span.ok{background:rgba(255,255,255,.45);color:var(--ink)}
.sr .btns{display:flex;gap:10px;justify-content:center}
.combo{flex:1;display:grid;grid-template-columns:1fr 60px 1fr;align-items:stretch;gap:0}
.combo .cb{background:var(--tint);border-radius:22px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:16px;gap:8px}
.combo .cb .k{font-family:var(--fn);font-weight:600;color:var(--ink2);font-size:16px;letter-spacing:.1em}
.combo .cb .v{font-family:var(--fh);font-size:56px;line-height:1.25}
.combo .x{display:grid;place-items:center;font-family:var(--fn);font-size:44px;color:var(--cc)}
.steps{flex:1;display:flex;flex-direction:column;justify-content:space-between;gap:6px}
.step{display:grid;grid-template-columns:40px 1fr 140px;align-items:center;gap:12px;background:var(--tint);border-radius:14px;padding:8px 10px 8px 14px;font-size:23px}
.step .n{font-family:var(--fn);font-weight:700;color:color-mix(in srgb,var(--cc) 75%,var(--ink));font-size:22px}
.step button{border:0;border-radius:999px;padding:7px 0;font-family:var(--fh);font-size:19px;background:var(--paper);color:var(--ink)}
.step button.s1{background:#d9f2e4;color:#11603b}.step button.s2{background:#fff0c2;color:#7a5600}.step button.s3{background:#ffd9d6;color:#8f2420}
.dice{display:flex;flex-direction:column;gap:12px;flex:1}
.qrgrid{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.qrc{background:var(--tint);border-radius:22px;padding:14px;display:grid;grid-template-columns:104px 1fr;gap:12px;align-items:center;text-decoration:none;color:var(--ink)}
.qrc img{width:104px;height:104px;border-radius:10px;background:#fff;padding:6px;image-rendering:pixelated}
.qrc h3{margin:0 0 6px;font-family:var(--fh);font-weight:400;font-size:23px;line-height:1.3}
.qrc p{margin:0;font-size:18px;line-height:1.45;color:var(--ink2)}
.refs{margin:0;padding-left:1.3em;font-size:15px;line-height:1.42;columns:2;column-gap:36px;flex:1}
.refs li{break-inside:avoid;margin-bottom:6px}

/* games */
.game{flex:1;display:flex;flex-direction:column;gap:12px;min-height:0}
.gbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.gbar .stat{margin-left:auto;display:flex;gap:10px}
.gbar .stat span{background:var(--tint);border-radius:999px;padding:6px 16px;font-family:var(--fn);font-weight:600;font-size:19px}
.garea{flex:1;min-height:0;background:var(--tint);border-radius:24px;position:relative;overflow:hidden;display:flex;flex-direction:column}
.gover{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:color-mix(in srgb,var(--tint) 90%,transparent);z-index:3;text-align:center;font-size:25px;padding:20px}
.gover .btn{font-size:26px;padding:14px 40px}
.gover h3{margin:0;font-family:var(--fh);font-weight:400;font-size:56px}
.gover[hidden]{display:none!important}
.stroopword{flex:1;display:grid;place-items:center;font-family:var(--fh);font-size:200px;line-height:1;transition:transform .1s}
.stroopbtns{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:0 16px 16px}
.stroopbtns button{border:0;border-radius:20px;height:96px;font-family:var(--fh);font-size:32px;color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.18)}
.flash-ok{animation:fok .3s}.flash-no{animation:fno .3s}
@keyframes fok{50%{background:#c9f0da}}@keyframes fno{50%{background:#ffd2cf}}
.mem{flex:1;display:grid;gap:12px;padding:16px}
.mc{border:0;border-radius:18px;background:transparent;position:relative;padding:0;transition:transform .2s}
.mc:active{transform:scale(.96)}
.mc .f,.mc .b{position:absolute;inset:0;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.mc .b{background:var(--cc);background-image:radial-gradient(circle at 30% 30%,rgba(255,255,255,.28) 0 14%,transparent 15%),radial-gradient(circle at 72% 70%,rgba(255,255,255,.18) 0 18%,transparent 19%)}
.mc .f{background:#fff;font-size:84px;line-height:1;opacity:0;transform:scale(.85)}
.mc .f small{font-family:var(--fh);font-size:28px;color:var(--ink)}
.mc.up .f{opacity:1;transform:none}.mc.up .b{opacity:0}
.mc.got .f{background:#d9f2e4}
.trail{flex:1;position:relative}
.trail svg{position:absolute;inset:0;width:100%;height:100%}
.trail .nd{cursor:pointer}
.trail .nd circle{fill:#fff;stroke:var(--cc);stroke-width:4}
.trail .nd text{font-family:var(--fh);font-size:30px;fill:var(--ink);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.trail .nd.done circle{fill:var(--cc)}
.trail .nd.done text{fill:#fff}
.trail .nd.bad circle{fill:#ffd2cf}
.market{flex:1;display:grid;grid-template-columns:1.1fr 1fr;gap:14px;padding:16px;min-height:0}
.basket{background:#fff;border-radius:20px;padding:16px;display:flex;flex-direction:column;justify-content:space-evenly;gap:10px}
.basket .itm{display:flex;align-items:center;gap:14px;font-family:var(--fh);font-size:28px}
.basket .itm i{font-style:normal;font-size:52px}
.basket .itm b{margin-left:auto;font-family:var(--fn);font-weight:600;font-size:30px;background:#fff6dc;border-radius:12px;padding:2px 12px}
.basket .q{font-family:var(--fh);font-size:26px;color:var(--cc);border-top:2px dashed var(--line);padding-top:10px}
.wallet{display:flex;flex-direction:column;gap:10px;justify-content:space-between}
.coins{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.coins button{border:0;border-radius:18px;height:70px;font-family:var(--fn);font-weight:700;font-size:28px;color:var(--ink);box-shadow:0 4px 0 rgba(0,0,0,.14)}
.coins .co{background:radial-gradient(circle at 35% 30%,#fff7cf,#e9c25a);border-radius:999px}
.coins .bi{background:linear-gradient(135deg,#d7ecff,#a9cdf5)}
.paid{background:#fff;border-radius:18px;padding:10px 16px;font-size:20px;min-height:84px;display:flex;flex-direction:column;gap:4px}
.paid .sum{font-family:var(--fn);font-weight:700;font-size:34px}
.paid .tok{display:flex;flex-wrap:wrap;gap:4px}
.paid .tok span{background:#fff6dc;border-radius:999px;padding:0 8px;font-family:var(--fn);font-size:15px}
.choices{display:grid;grid-template-columns:1fr;gap:10px;flex:1}
.choices button{border:0;border-radius:18px;background:#fff;font-family:var(--fn);font-size:36px;font-weight:600;color:var(--ink);box-shadow:0 4px 0 rgba(0,0,0,.1)}
.sort{flex:1;display:flex;flex-direction:column;gap:12px;padding:16px;min-height:0}
.pool{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;min-height:62px}
.pool button{border:0;background:#fff;border-radius:16px;padding:10px 20px;font-family:var(--fh);font-size:26px;color:var(--ink);box-shadow:0 4px 0 rgba(0,0,0,.1)}
.pool button.sel{background:var(--ink);color:#fff;transform:translateY(-3px)}
.bins{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.bin{border:3px dashed color-mix(in srgb,var(--cc) 50%,#fff);background:rgba(255,255,255,.6);border-radius:22px;display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px;font-size:22px;color:var(--ink)}
.bin h4{margin:0;font-family:var(--fh);font-weight:400;font-size:30px;color:var(--cc)}
.bin span{background:#fff;border-radius:12px;padding:4px 14px;font-family:var(--fh);font-size:22px}
.recall{flex:1;display:grid;grid-template-columns:repeat(5,1fr);gap:12px;padding:16px}
.recall button{border:0;background:#fff;border-radius:18px;font-family:var(--fh);font-size:32px;color:var(--ink);box-shadow:0 4px 0 rgba(0,0,0,.1)}
.recall button.on{background:var(--ink);color:#fff}
.recall.check button.t{background:var(--ok);color:#fff}
.recall.check button.on:not(.t){background:var(--bad);color:#fff}

/* phone / narrow: reading mode */
body.mob{overflow:auto}
body.mob #world{opacity:.35;pointer-events:none}
body.mob #ui{box-sizing:border-box;position:relative;transform:none!important;width:100%;height:auto;pointer-events:auto;padding:12px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
body.mob .top{position:relative;left:0;right:0;top:0;flex-wrap:wrap;margin-bottom:14px}
body.mob .chips{flex-wrap:wrap}
body.mob #deck{position:relative;display:flex;flex-direction:column;gap:20px}
body.mob .slide{position:relative;display:block}
body.mob .card,body.mob .slide.wide .card,body.mob .slide.cover .card{position:relative;left:0;top:0;width:100%;height:auto;padding:22px 18px;animation:none}
body.mob .slide.cover .card{background:rgba(255,253,248,.9);padding:22px 18px;border-radius:26px}
body.mob .cover h1{font-size:46px}body.mob .cover h1 span{font-size:30px}
body.mob .cover .meta{flex-direction:column}
body.mob .card h2{font-size:30px}
body.mob .bd{font-size:17px}
body.mob .grid,body.mob .flipq,body.mob .qrgrid,body.mob .errs,body.mob .clockwrap,body.mob .market,body.mob .bins{grid-template-columns:1fr!important}
body.mob .words,body.mob .recall{grid-template-columns:repeat(3,1fr)}
body.mob .cst{grid-template-columns:repeat(3,1fr);grid-template-rows:none}
body.mob .flow{flex-direction:column}body.mob .flow .ar{width:auto;transform:rotate(90deg)}
body.mob .combo{grid-template-columns:1fr}
body.mob .tbl{font-size:15px;display:block;overflow-x:auto}
body.mob .tbl td:first-child{white-space:normal}
body.mob .refs{columns:1}
body.mob .garea{min-height:420px}
body.mob .stroopword{font-size:110px}
body.mob .stroopbtns button{height:70px;font-size:22px}
body.mob .bar,body.mob .progress,body.mob #hud{display:none}
body.mob .pad2{height:320px}
body.mob .row{flex-direction:column}
body.mob .ad8 .q{grid-template-columns:28px 1fr}body.mob .ad8 .q .seg{grid-column:1/-1;justify-self:start}
body.mob .stroopbtns{grid-template-columns:1fr 1fr}body.mob .coins{grid-template-columns:repeat(3,1fr)}body.mob .cst div{font-size:16px}
body.mob .agenda .it{grid-template-columns:44px 1fr 60px}

/* speaker + fb */
.spk{display:grid;grid-template-columns:300px 1fr;gap:28px;flex:1;min-height:0}
.spk .ph{width:300px;height:300px;border-radius:28px;object-fit:cover;box-shadow:0 8px 0 var(--tint2)}
.fbcard{display:grid;grid-template-columns:112px 1fr;gap:14px;align-items:center;background:#1f4fa8;color:#fff;border-radius:22px;padding:14px;text-decoration:none;box-shadow:0 6px 0 rgba(31,79,168,.25);transition:transform .15s}
.fbcard:hover{transform:translateY(-2px)}
.fbcard img{width:112px;height:112px;background:#fff;border-radius:12px;padding:6px;image-rendering:pixelated}
.fbcard b{display:block;font-family:var(--fh);font-weight:400;font-size:22px;line-height:1.3}
.fbcard small{display:block;font-size:15px;opacity:.88;line-height:1.45;margin-top:2px}
.fbcard em{display:inline-block;margin-top:6px;font-style:normal;font-family:var(--fh);background:#fff;color:#1f4fa8;border-radius:999px;padding:2px 12px;font-size:16px}
.roles{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;justify-content:space-between;flex:1;gap:8px}
.roles li{background:var(--tint);border-radius:14px;padding:9px 16px;font-size:21px;line-height:1.45}
.roles li b{font-family:var(--fh);font-weight:400}
a.qr{color:inherit;text-decoration:none}
a.qrlink{display:block;border-radius:12px}
a.qrlink:hover,a.qr:hover{outline:3px solid var(--cc);outline-offset:2px}
/* ice-breakers */
.ice{display:grid;grid-template-columns:330px 1fr;gap:22px;flex:1;min-height:0}
.gamecard{background:var(--cc);color:#fff;border-radius:24px;padding:18px;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;gap:10px;text-decoration:none;text-align:center;box-shadow:0 7px 0 color-mix(in srgb,var(--cc) 45%,#000 10%)}
.gamecard img{width:190px;height:190px;background:#fff;border-radius:16px;padding:8px;image-rendering:pixelated}
.gamecard b{font-family:var(--fh);font-weight:400;font-size:30px;line-height:1.2}
.gamecard span{font-size:17px;opacity:.92;line-height:1.45}
.gamecard em{font-style:normal;font-family:var(--fh);font-size:21px;background:#fff;color:var(--ink);border-radius:999px;padding:8px 22px}
.gq{background:var(--tint);border-radius:20px;padding:14px 18px;display:flex;flex-direction:column;gap:10px;justify-content:center}
.gq>p{margin:0;font-size:22px;line-height:1.5}
.gq .opts{display:flex;gap:10px;flex-wrap:wrap}
.gq .opts button{flex:1;min-width:120px;border:0;border-radius:14px;background:var(--paper);padding:10px 14px;font-family:var(--fh);font-size:21px;color:var(--ink)}
.gq.done .opts button.right{background:var(--ok);color:#fff}
.gq.done .opts button.wrongpick{background:var(--bad);color:#fff}
.gq .why{display:none;font-size:18px;line-height:1.5;color:var(--ink2)}
.gq.done .why{display:block}
/* quiz */
.qz{flex:1;display:flex;flex-direction:column;gap:14px;min-height:0}
.qtop{display:flex;align-items:center;gap:10px}
.qdots{display:flex;gap:8px}
.qdots i{width:16px;height:16px;border-radius:50%;background:var(--tint2)}
.qdots i.on{background:var(--ink)}.qdots i.ok{background:var(--ok)}.qdots i.no{background:var(--bad)}
.qtop .qs{margin-left:auto;font-family:var(--fn);font-weight:600;font-size:20px;background:var(--tint);border-radius:999px;padding:4px 16px}
.qq{font-family:var(--fh);font-size:36px;line-height:1.35;text-wrap:balance}
.qopts{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:14px;min-height:0}
.qopts button{border:0;border-radius:20px;background:var(--tint);font-size:29px;line-height:1.35;text-align:left;padding:14px 20px;display:flex;gap:14px;align-items:center;color:var(--ink);font-family:var(--fb);transition:transform .12s}
.qopts button:hover{transform:translateY(-2px)}
.qopts button b{flex:none;width:46px;height:46px;border-radius:50%;background:var(--paper);display:grid;place-items:center;font-family:var(--fn);font-size:22px;color:var(--cc)}
.qopts button.right{background:var(--ok);color:#fff}.qopts button.wrong{background:var(--bad);color:#fff}
.qopts.locked button{pointer-events:none}
.qopts.locked button:not(.right):not(.wrong){opacity:.55}
.qfb{display:flex;align-items:center;gap:16px;background:#fff6dc;border-radius:18px;padding:12px 18px;font-size:21px;line-height:1.5;min-height:92px;visibility:hidden}
.qfb.on{visibility:visible}
.qfb span{flex:1}
.qsrc{display:block;font-size:15px;color:#7a8399;margin-top:4px}
.qend{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center}
.stamp{width:230px;height:230px;border-radius:50%;border:8px double var(--cc);color:var(--cc);display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(-10deg);font-family:var(--fh);animation:stampin .5s cubic-bezier(.2,1.6,.4,1) both}
.stamp b{font-size:46px;font-weight:400;line-height:1.1}.stamp small{font-size:20px}
.stamp.fail{border-color:#b9b2a6;color:#8a8376}
@keyframes stampin{from{transform:rotate(-10deg) scale(2.2);opacity:0}to{transform:rotate(-10deg) scale(1);opacity:1}}
.qend p{margin:0;font-size:24px}
.qend .row{justify-content:center}
.slide.pre .card{--tint:color-mix(in srgb,var(--cc) 14%,#fff)}
/* passport */
.passport{margin-left:auto;display:flex;gap:8px;align-items:center;pointer-events:auto;background:rgba(255,253,248,.85);border-radius:999px;padding:6px 8px 6px 16px;border:0;font-family:var(--fh);font-size:17px;color:var(--ink)}
.passport i{width:30px;height:30px;border-radius:50%;border:2px dashed #b9b2a6;display:grid;place-items:center;font-style:normal;font-family:var(--fn);font-weight:700;font-size:15px;color:#9a9385}
.passport i.got{border:0;background:var(--cc);color:#fff}
.passport .sc{font-family:var(--fn);font-weight:600;background:var(--ink);color:#fff;border-radius:999px;padding:4px 12px}
.ppb{flex:1;display:flex;flex-direction:column;gap:12px;justify-content:space-between}
.ppr{display:grid;grid-template-columns:62px 190px 1fr 96px 150px;align-items:center;gap:14px;background:var(--tint);border-radius:18px;padding:10px 16px;font-size:21px}
.ppr .st{width:54px;height:54px;border-radius:50%;border:3px dashed #b9b2a6;display:grid;place-items:center;font-family:var(--fn);font-weight:700;color:#9a9385}
.ppr .st.got{border:0;background:var(--sc);color:#fff;transform:rotate(-8deg)}
.ppr h3{margin:0;font-family:var(--fh);font-weight:400;font-size:26px}
.ppr .tr{height:22px;background:#fff;border-radius:999px;overflow:hidden}.ppr .tr i{display:block;height:100%;background:var(--sc)}
.ppr .v{font-family:var(--fn);font-weight:600;text-align:right}
.ppr button{border:0;border-radius:999px;background:var(--ink);color:#fff;font-family:var(--fh);font-size:18px;padding:8px 0}
.ppsum{background:var(--ink);color:#fff;border-radius:20px;padding:16px 22px;font-size:22px;display:flex;gap:20px;align-items:center}
.ppsum .big{color:#fff;font-size:60px}
/* card map button */
.tomap{position:absolute;right:28px;top:26px;border:0;background:var(--tint);border-radius:999px;padding:6px 16px;font-family:var(--fh);font-size:17px;color:var(--ink)}
.tomap:hover{background:var(--tint2)}
/* map (mind-map of billboards) */
#map{position:absolute;inset:0;display:none;pointer-events:none}
body.mapping #map{display:block}
body.mapping #deck{display:none}
#mapLines{position:absolute;inset:0;width:1600px;height:900px;overflow:visible}
.mhub{display:none}
.mhub small{display:block;font-family:var(--fb);font-size:14px;opacity:.8}
.mcard{position:absolute;width:340px;pointer-events:auto;background:var(--paper);border:4px solid var(--cc);border-radius:20px;box-shadow:0 8px 0 color-mix(in srgb,var(--cc) 35%,transparent),0 18px 40px rgba(34,48,74,.18);overflow:hidden;transition:transform .2s}
.mcard:hover{transform:translateY(-4px)}
.mcard .mh{display:flex;align-items:center;gap:12px;background:var(--cc);color:#fff;border:0;width:100%;padding:7px 14px;text-align:left;font-family:var(--fh);font-size:29px}
.slide[data-ch="2"] .mh,.mcard[data-ch="2"] .mh{color:var(--ink)}
.mcard .mh b{width:40px;height:40px;border-radius:50%;background:#fff;color:var(--cc);display:grid;place-items:center;font-family:var(--fn);font-size:24px;flex:none}
.mcard .mh small{margin-left:auto;font-family:var(--fn);font-size:17px;opacity:.9}
.mcard .mb{display:flex;flex-wrap:wrap;gap:5px;padding:8px 10px 4px}
.mcard .mb button{border:0;background:var(--tint);border-radius:999px;padding:3px 9px;font-size:14.5px;color:var(--ink);font-family:var(--fb)}
.mcard .mb button:hover{background:var(--tint2)}
.mcard .mf{display:flex;justify-content:space-between;align-items:center;padding:2px 14px 8px;font-size:14.5px;color:var(--ink2)}
.mcard .mf .ok{color:var(--ok);font-weight:700}
.mcard.next{animation:pulse 1.6s infinite}
.mcard.next::after{content:"下一站";position:absolute;right:0;top:54px;background:var(--ink);color:#fff;font-family:var(--fh);font-size:16px;padding:3px 14px 3px 12px;border-radius:999px 0 0 999px}
@keyframes pulse{0%,100%{box-shadow:0 8px 0 color-mix(in srgb,var(--cc) 35%,transparent),0 0 0 0 color-mix(in srgb,var(--cc) 50%,transparent)}50%{box-shadow:0 8px 0 color-mix(in srgb,var(--cc) 35%,transparent),0 0 0 14px color-mix(in srgb,var(--cc) 0%,transparent)}}
.maptip{position:absolute;left:50%;bottom:76px;transform:translateX(-50%);background:var(--paper);border-radius:999px;padding:8px 22px;font-family:var(--fh);font-size:19px;box-shadow:0 4px 0 rgba(34,48,74,.14);white-space:nowrap}
body.mob #map{display:block;position:relative;margin-bottom:20px}
body.mob #mapLines,body.mob .mhub,body.mob .maptip{display:none}
body.mob #mapCards{display:grid;grid-template-columns:1fr;gap:14px}
body.mob .mcard{position:relative;left:auto!important;top:auto!important;width:100%}
body.mob .passport{display:none}
body.mob .spk,body.mob .ice{grid-template-columns:1fr}
body.mob .spk .ph{width:200px;height:200px}
body.mob .qopts{grid-template-columns:1fr}
body.mob .qq{font-size:24px}
body.mob .ppr{grid-template-columns:44px 1fr 70px;font-size:16px}body.mob .ppr .tr,body.mob .ppr button{display:none}
body.mob .tomap{display:none}

/* zoom: enlarge any block in a popup */
#zoom{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(34,48,74,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#zoom.on{display:flex}
#zoom .slide{position:relative;inset:auto;display:block;flex:none}
#zoom .card,#zoom .slide.wide .card{position:relative;left:auto;top:auto;width:auto;height:auto;padding:26px 30px;animation:none;transform-origin:center center;box-shadow:0 24px 80px rgba(0,0,0,.3);display:block}
#zoom .bd{display:block}
#zoom .zx{position:fixed;right:max(20px,env(safe-area-inset-right,0px));top:max(20px,env(safe-area-inset-top,0px));width:56px;height:56px;border:0;border-radius:50%;background:#fff;color:var(--ink);font-size:30px;box-shadow:0 6px 0 rgba(0,0,0,.2);z-index:2}
#zoom .zhint{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:rgba(255,253,248,.92);border-radius:999px;padding:6px 18px;font-family:var(--fh);font-size:17px;color:var(--ink)}
#zbtn{position:absolute;z-index:6;display:none;align-items:center;gap:6px;border:0;border-radius:999px;background:var(--ink);color:#fff;font-family:var(--fh);font-size:16px;padding:5px 12px 5px 9px;box-shadow:0 3px 0 rgba(0,0,0,.2);pointer-events:auto}
#zbtn svg{width:18px;height:18px}
#zbtn.on{display:inline-flex}
body.zpick .slide.on .zable{outline:3px dashed color-mix(in srgb,var(--cc) 70%,transparent);outline-offset:3px;cursor:zoom-in}
body.zpick .slide.on .zable:hover{outline-style:solid;background-color:color-mix(in srgb,var(--cc) 8%,transparent)}
.bar #bZoom.on{background:var(--ink);color:#fff}
body.mob #zbtn{display:none!important}

function qrA(url,cell,cls){return '<a class="qrlink'+(cls?' '+cls:'')+'" href="'+url+'" target="_blank" rel="noopener" title="開啟 '+url+'">'+qrImg(url,cell)+'</a>';}
function GQ(q,opts,a,why){return `<div class="gq" data-a="${a}"><p>${q}</p><div class="opts">${opts.map((o,i)=>`<button data-v="${i}">${o}</button>`).join('')}</div><span class="why">${why}</span></div>`;}
function QZ(ch,tag,title,qs,o={}){S(ch,tag,title,`<div class="qz"></div>`,Object.assign({init:c=>initQuiz(c,ch,qs,o),quiz:!o.pre,pre:!!o.pre,nq:qs.length},o.extra||{}));}
function S(ch,tag,title,body,o={}){SL.push(Object.assign({ch,tag,title,body},o));}
function PIC(n,alt){return `<img class="pic" src="img/${n}.jpg" alt="${alt}" loading="lazy">`;}
/* YouTube: poster first, iframe only after a click; QR + link work where embeds are blocked */
function VID(id,poster,cap,st,en){return `<div class="vbox" data-yt="${id}" data-poster="${poster}" data-cap="${cap}" data-st="${st||0}" data-en="${en||''}"></div>`;}
function vPoster(b){b.innerHTML=`<img src="img/${b.dataset.poster}.jpg" alt="${b.dataset.cap}"><button class="vplay" aria-label="播放影片">▶ 播放影片</button><span class="vcap">${b.dataset.cap}</span>`;b.querySelector('.vplay').onclick=()=>{b.innerHTML=`<iframe src="https://www.youtube-nocookie.com/embed/${b.dataset.yt}?autoplay=1&rel=0&start=${b.dataset.st||0}${b.dataset.en?'&end='+b.dataset.en:''}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen title="${b.dataset.cap}"></iframe>`;};}
function initVid(c){c.querySelectorAll('.vbox').forEach(vPoster);c._stop=()=>c.querySelectorAll('.vbox').forEach(b=>{if(b.querySelector('iframe'))vPoster(b);});}
/* one short video + what to watch for + QR */
function VSLIDE(ch,tag,title,id,cap,len,pts,src,st,en){const u='https://www.youtube.com/watch?v='+id;S(ch,tag,title,`
 <div class="row f1">
  <div class="col" style="flex:0 0 880px">${VID(id,'yt_'+id,cap+'（'+len+'）',st,en)}</div>
  <div class="col f1">
   <div class="tile f1"><span class="k">看影片時注意</span><h3>看完要能回答</h3><ul class="dots">${pts.map(x=>`<li>${x}</li>`).join('')}</ul></div>
   <a class="qrc" href="${u}" target="_blank" rel="noopener">${qrImg(u,4)}<span><h3>掃描看影片</h3><p>${len}・手機掃 QR 或點這裡開啟</p></span></a>
  </div>
 </div>
 <div class="src">影片來源：${src}</div>`,{wide:true,init:initVid});}
function qrImg(url,cell=6){try{const q=qrcode(0,'M');q.addData(url);q.make();return '<img alt="QR code" src="'+q.createDataURL(cell,2)+'">';}catch(e){return '';}}
/* mid-unit check: a few one-tap questions */
function CHK(ch,title,qs){S(ch,CH[ch].n+' · 小檢核',title,`<p class="lead">上完一段，先停下來確認：點選你的答案，會立刻看到對錯和理由。</p><div class="chk">${qs.map(q=>GQ(q[0],q[1],q[2],q[3])).join('')}</div>`,{wide:true,chk:true});}

 <div class="score"><span class="big" id="tallyN">0</span><span id="tallyT">三項以上的人，這堂課就是為你上的。每一項都有名字、有法規、有處理流程，標籤告訴你在哪一站。</span></div>`,{wide:true,init:c=>{const n=c.querySelector('#tallyN');c.querySelectorAll('#tally button').forEach(b=>b.onclick=()=>{b.classList.toggle('on');const k=c.querySelectorAll('#tally button.on').length;n.textContent=k;c.querySelector('#tallyT').textContent=k>=3?'舉手三項以上：這堂課就是為你上的。這些都不是「做這行本來就這樣」。':'三項以上的人，這堂課就是為你上的。每一項都有名字、有法規、有處理流程，標籤告訴你在哪一站。';});}});

S(1,'安全轉移位 · 為什麼先學','照顧工作最常受傷的，是自己的腰和肩',`
 <div class="row f1">
  <div class="tile" style="flex:0 0 560px;padding:10px;background:#fff">${PIC('stats','職業病統計：手臂肩頸疾病 46%、職業性下背痛 12%')}</div>
  <div class="col f1">
   <div class="tile solid f1" style="justify-content:center"><span class="k">肌肉骨骼相關職業病</span><span class="big" style="color:#fff;font-size:120px">58%</span><p>手臂肩頸疾病 46% ＋ 職業性下背痛 12%</p></div>
   <div class="tile f1"><h3>一次做錯不會怎樣，天天做錯就會</h3><p>轉移位是每天重複幾十次的動作。這一站先把「怎麼移」學對，後面三站再談法規、危害和受傷之後。</p></div>
  </div>
 </div>
 <div class="src">資料來源：勞動部勞工保險局職業病給付統計（圖取自《安全移轉位》講義）。</div>`,{wide:true});

S(1,'安全轉移位 · 腰椎壓力','坐著彎腰搬東西，腰的負擔是站著的快三倍',`
 <div class="row f1">
  <div class="tile f1"><h3>各種姿勢的腰椎間盤壓力（站立 ＝ 100）</h3>
   <div class="bars" style="flex:1;justify-content:space-evenly">
    ${[['平躺',25],['站立',100],['坐正',140],['坐著前傾',185],['彎腰搬東西',220],['坐著彎腰搬',275]].map(a=>`<div class="barrow"><span>${a[0]}</span><span class="tr"><i style="width:${a[1]/275*100}%;${a[1]>=220?'':'opacity:.55'}"></i></span><span class="v">${a[1]}</span></div>`).join('')}
   </div>
  </div>
  <div class="col" style="flex:0 0 470px">
   <div class="tile solid f1" style="justify-content:center"><h3>轉移位，剛好就是「彎腰＋負重」</h3><p>所以這一站所有技巧都在做同一件事：<b>不要彎著腰出力</b>。</p></div>
   <div class="tile f1"><h3>腰痛了會自己好嗎？</h3><p>多數急性腰痛在 6 週內明顯好轉。但有些警訊不能等，下一頁告訴你。</p></div>
  </div>
 </div>
 <div class="src">資料來源：Nachemson AL. The lumbar spine: an orthopaedic challenge. Spine 1976;1(1):59–71（腰椎間盤內壓，站立＝100 的相對值）。</div>`,{wide:true});

S(1,'安全轉移位 · 腰痛就醫','腰痛會自己好嗎？什麼時候不能等',`
 <div class="grid g3">
  <div class="tile"><span class="k">MOST GET BETTER</span><h3>多數會好轉</h3><p>急性腰痛大多在<b>前 6 週</b>明顯改善，之後進步變慢；一年後仍有部分人留有輕微疼痛。</p><p>居家處理幾週沒有改善、影響工作或生活，就該看醫師。</p></div>
  <div class="tile solid"><span class="k">GO NOW</span><h3>立刻就醫（急診）</h3><ul class="dots"><li>兩腳麻、刺痛或無力</li><li>會陰、肛門周圍感覺變差</li><li>解不出尿，或大小便失禁</li><li>車禍、跌倒等嚴重外傷後才痛</li></ul></div>
  <div class="tile"><span class="k">SEE A DOCTOR SOON</span><h3>盡快看醫師</h3><ul class="dots"><li>發燒、發冷、全身不舒服</li><li>體重莫名下降</li><li>休息也不會減輕，或晚上更痛</li><li>突然劇痛，或越來越嚴重</li></ul></div>
 </div>
 <div class="note">跟工作有關的腰痛：掛<b>職業醫學科</b>、拿職業傷病門診單、留下紀錄（第 4 站會教）。</div>
 <div class="src">資料來源：Costa LCM, et al. The prognosis of acute and persistent low-back pain: a meta-analysis. CMAJ 2012;184(11):E613–24；英國 NHS〈Back pain〉就醫指引（2026 更新）；NICE NG59 Low back pain and sciatica in over 16s。</div>`,{wide:true});

S(1,'安全轉移位 · 人因性','你的腰，正在替誰扛？',`
 <div class="grid g2">
  <div class="tile"><span class="k">TOP 5</span><h3>最傷腰的五個動作</h3><ul class="dots"><li>從床上把個案抱起、移位到輪椅</li><li>彎腰換尿布、床上擦澡</li><li>單手撐住個案，另一手做事</li><li>推輪椅上下斜坡、跨門檻</li><li>搬洗澡椅、便盆椅、搬運物品</li></ul></div>
  <div class="tile"><span class="k">RED FLAGS</span><h3>這些不是「休息一下就好」</h3><ul class="dots"><li>痠痛持續超過三天沒有改善</li><li>半夜會被痛醒</li><li>手麻、腳麻，或握力變差</li><li>同一個動作就一定會痛</li><li>痛到需要靠止痛藥才能上班</li></ul></div>
 </div>
 <div class="tile solid" style="flex:0 0 auto"><h3>它不是一次受傷，是每天累積一點</h3><p>所以「這次撐一下就好」是最貴的決定。出現任一警訊，就該調整方法、要求輔具、並就醫評估，而不是換一邊肩膀繼續扛。</p></div>`,{wide:true});

S(1,'安全轉移位 · 核心觀念','零抬舉：抱不動的時候，不要硬抱',`
 <div class="grid g2">
  <div class="tile"><span class="k">NO-LIFT</span><h3>零抬舉 No-Lift Policy</h3><p>一套符合人體工學的安全照護觀念，目的是避免職業傷害。照顧者受傷的三個原因：</p><p>${['人力難求','欠缺教育訓練','輔具不足'].map(x=>`<span class="pill">${x}</span>`).join('')}</p><p>NIOSH 研究員 Waters 推算：個案能配合時，每位照顧者徒手承擔約 <b>16 公斤（35 磅）</b>以內；超過就用輔具。怎麼判斷，看下一頁。</p></div>
  <div class="tile"><span class="k">HORIZONTAL</span><h3>水平取代垂直</h3><ul class="dots"><li>把人「抬起來」是垂直，最傷腰</li><li>讓屁股「平移過去」是水平，省力很多</li><li>扶手、腳靠能掀開，輪椅才能貼近床</li><li>床面和輪椅座面一樣高，或出發的那邊略高</li></ul><p>選輪椅先看：<b>扶手能不能掀、腳靠能不能掀</b>。</p></div>
 </div>
 <div class="src">資料來源：Waters TR. When is it safe to manually lift a patient? Am J Nurs 2007;107(8):53–59（以 NIOSH 修訂提舉公式推算，約 35 磅）。</div>`,{wide:true});

S(1,'安全轉移位 · 16 公斤怎麼判斷','16 公斤怎麼判斷？算「你要扛的那一份」',`
 <div class="row f1">
  <div class="col f1">
   <div class="tile f1"><span class="k">STEP 1</span><h3>先估你要承擔多少</h3><p>個案自己撐得住的部分不算，算的是<b>落在你手上的重量</b>。</p><ul class="dots"><li><b>一條腿 ≈ 體重 16%</b>：60 公斤長輩一條腿約 10 公斤；超過 100 公斤，一條腿就超過 16 公斤</li><li><b>坐到站</b>：82 公斤、只能自己撐一半，兩人分剩下的 41 公斤，每人約 20 公斤，已超過</li><li><b>完全依賴</b>：90 公斤四個人抬，每人約 23 公斤，仍超過</li></ul></div>
  </div>
  <div class="col f1">
   <div class="tile f1"><span class="k">STEP 2</span><h3>用「腳能撐住嗎」快速分</h3><ul class="dots"><li><b>腳全撐、聽得懂口令</b>：你只扶持保護，可徒手（復能版）</li><li><b>腳只撐一部分</b>：移位腰帶、轉盤、站立輔具，或兩人</li><li><b>腳撐不住、無法配合</b>：成人都遠超過 16 公斤，用移位板、滑布、移位機</li></ul></div>
   <div class="tile solid" style="flex:0 0 auto"><h3>前提：個案能配合、動作平穩</h3><p>躁動、抗拒、可能突然動的個案，這個算法不適用，不要徒手。16 公斤是研究推算，不是法定標準。</p></div>
  </div>
 </div>
 <div class="src">資料來源：Waters TR. Am J Nurs 2007;107(8):53–59（三個例子依原文 180 磅、200 磅、腿重約體重 16% 換算）；Lu ML. Revisiting the limits of the 35 pound limit（PMC8985990）。</div>`,{wide:true});

S(1,'安全轉移位 · 兩種轉移位','復能轉移位 vs 協助轉移位',`
 <div class="grid g2">
  <div class="tile"><span class="k">REABLEMENT</span><h3>復能轉移位：讓個案自己來</h3><ul class="dots"><li><b>目的</b>：每一次移位都是訓練，把能力練回來</li><li><b>誰出力</b>：個案為主，你給口令、引導、在旁保護</li><li><b>擺位</b>：輪椅與床夾 30–45°，個案抓對側扶手自己轉</li><li><b>適合</b>：聽得懂指令、腳能撐一部分、坐得住</li><li><b>代價</b>：比較花時間，要等他</li></ul></div>
  <div class="tile"><span class="k">ASSISTED</span><h3>協助轉移位：照顧者帶著做</h3><ul class="dots"><li><b>目的</b>：安全、省力地把人移過去</li><li><b>誰出力</b>：照顧者為主，個案能幫多少算多少</li><li><b>擺位</b>：輪椅貼床，卡膝，弓箭步重心轉移，或用輔具</li><li><b>適合</b>：幾乎無法出力、無法配合、當天狀況不好</li><li><b>重點</b>：水平移動，不抬舉</li></ul></div>
 </div>
 <div class="tile solid" style="flex:0 0 auto"><p style="font-size:26px">不是二選一。同一位長輩，早上有精神用復能，晚上累了用協助，都對。</p></div>`,{wide:true});

S(1,'安全轉移位 · 復能怎麼做','做得到的不幫，做不到的才補',`
 <div class="row f1">
  <div class="tile f1"><h3>復能四要訣</h3><ol class="seq">${['<b>先等 3–5 秒</b>：說完口令，給他時間反應','<b>一次說一步</b>：「腳往後收」「身體往前」「手抓扶手」','<b>只補他差的那一點</b>：站不起來補骨盆，不敢轉就站患側','<b>補的越來越少</b>：這次出三分力，下次試兩分'].map(x=>`<li>${x}</li>`).join('')}</ol></div>
  <div class="tile solid" style="flex:0 0 440px"><h3>協助由少到多</h3><ol class="seq">${['口頭提示','手勢、示範','輕觸引導方向','部分協助（補一點力）','完全協助'].map(x=>`<li>${x}</li>`).join('')}</ol></div>
 </div>
 <div class="note">這五級也是居家復能與日照的共同語言，寫服務紀錄時可以直接用。</div>`,{wide:true});

S(1,'安全轉移位 · 動手之前','先問四個問題，記住三個不要',`
 <div class="grid g2">
  <div class="tile" style="padding:12px;background:#fff;justify-content:flex-start">${PIC('assess4q','動手之前先問四個問題：腳能撐住嗎、能配合口令嗎、坐得穩嗎、手有力氣嗎')}<p style="margin-top:8px">四題的答案決定用<b>復能版</b>還是<b>協助版</b>，以及要不要輔具或第二個人。</p></div>
  <div class="tile" style="padding:12px;background:#fff;justify-content:flex-start">${PIC('donts','三個不要：拉手臂、從腋下抱、扭腰轉身')}<p style="margin-top:8px"><b>不拉手臂</b>（肩半脫位）、<b>不從腋下抱</b>（傷肩）、<b>不扭腰轉身</b>（閃到腰）。</p></div>
 </div>
 <div class="tile solid" style="flex:0 0 auto"><p>遇到個案完全無法出力又比你重、躁動抗拒、今天特別虛弱，或你自己腰正在痛：<b>先停</b>，找第二個人或用輔具，並回報督導。</p></div>
 <div class="src">圖：鍾孟修〈轉移位技巧：不是比力氣，是比方法〉動畫。</div>`,{wide:true});

CHK(1,'核心觀念，聽懂了嗎？',[
 ['同一位長輩早上精神好、晚上很累，轉移位方式要怎麼選？',['一律用協助版比較安全','早上用復能版、晚上用協助版','一律讓他自己來'],1,'不是二選一。看當下能力選方法，都對。'],
 ['徒手協助移位，照顧者承擔的重量建議上限大約是？',['16 公斤','40 公斤','只要抱得動就好'],0,'約 16 公斤（35 磅），算的是落在你手上的重量；超過就用輔具或兩人。（Waters, Am J Nurs 2007）'],
 ['個案坐不穩要往後挪，下面哪個做法最不建議？',['請他先往前傾','從腋下把他往上提','抓交叉的前臂往後帶'],1,'從腋下提會壓迫腋下、傷他的肩，也傷你的腰。']]);

S(1,'安全轉移位 · 保護自己','彎髖不彎腰：三個保護腰的姿勢',`
 <div class="grid g3">
  <div class="tile"><span class="big" style="font-size:72px">1</span><h3>髖鉸鍊 Hip hinge</h3><p>彎的是髖，不是腰。後腦杓、上背、尾椎成一直線，膝蓋微彎，臀部往後推，用臀大肌出力。</p><p class="src" style="font-size:17px">自我檢查：一根棍子貼著後腦、上背、尾椎，彎身時三點都不離開。</p></div>
  <div class="tile"><span class="big" style="font-size:72px">2</span><h3>彎一腳、直一腳</h3><p>床邊照顧時，一腳膝蓋跪上床、踩矮凳，或前後站，骨盆被鎖住，脊椎自然保持中立。</p></div>
  <div class="tile"><span class="big" style="font-size:72px">3</span><h3>弓箭步重心轉移</h3><p>兩腳前後站開、膝微彎，重心從一腳移到另一腳，手只是「掛」著個案。<b>重心移動的方向 ＝ 個案屁股要去的方向。</b></p></div>
 </div>
 <div class="note">護腰不是萬靈丹：位置要在髂嵴（骨盆上緣），只在搬移時繫緊，平常放鬆。</div>`,{wide:true});

S(1,'安全轉移位 · 預防技術','省力搬運與移位　五原則',`
 <div class="flow">
  ${[['1','靠近','讓個案貼近你的身體重心，距離每多十公分，腰的負擔就多一截'],['2','蹲不彎','屈膝蹲下，背保持直立。用大腿的力量起身，不要用腰去撐'],['3','不扭轉','換方向時移動腳步，絕對不要腰不動、上半身硬轉'],['4','借力不用力','移位滑墊、轉位板、移位腰帶、床欄：會用輔具不是偷懶'],['5','說在前','先告訴個案要做什麼、數 1、2、3，讓他一起出力，你就少扛一半']].map((a,i)=>`${i?'<div class="ar">›</div>':''}<div class="st"><span class="k">${a[0]}</span><h3>${a[1]}</h3><p>${a[2]}</p></div>`).join('')}
 </div>
 <div class="note">五個原則裡，「說在前」最省力，也最常被跳過。</div>`,{wide:true});

S(1,'安全轉移位 · 動手前 30 秒','先把環境準備好',`
 <div class="row f1">
  <div class="tile" style="flex:0 0 640px;padding:10px;background:#fff">${PIC('setup','床到輪椅的環境準備：輪椅斜放 30 到 45 度、煞車、腳踏板收起、床和輪椅一樣高、穿防滑鞋、坐床邊兩腳踩穩')}</div>
  <div class="grid g2 f1">
   ${[['輪椅','剎車踩了嗎？腳踏板收起來了嗎？'],['床','高度和輪椅座面差不多嗎？床輪鎖了嗎？'],['地面和鞋子','地板乾的嗎？穿防滑鞋了嗎？'],['管路','尿管、鼻胃管、氧氣管夠長嗎？'],['個案狀況','剛坐起來會頭暈嗎？先坐 30 秒再動'],['說明','告訴他要去哪裡，約好口令「一、二、三」']].map(a=>`<div class="tile"><h3 style="font-size:26px">${a[0]}</h3><p style="font-size:20px">${a[1]}</p></div>`).join('')}

S(2,'風險與權益 · 實務現場','長照、日照、身障單位最常見的六個勞動爭議',`
 <div class="grid g3">

     ['時薪制的陷阱','時薪制一樣有特休、國定假日工資與加班費，實務上最常被漏掉'],
     ['變形工時','全時：依法定正常工時上班（每日 8、每週 40 小時）。部分工時：工時比同單位全時同事明顯短，例如時薪制、排班少。變形工時原則上只適用全時勞工'],
     ['特別休假','部分工時勞工也有特別休假，依工作時間比例計給，不是「兼職就沒有」'],
     ['輪班與移動時間','夜班、輪班間隔與休息；居服案家之間的移動是否算工時，務必在契約中確認並留紀錄'],
     ['有薪假被扣全勤','公傷病假、生理假、家庭照顧假、婚假、產假各有規定，不能一律當事假處理']].map((a,i)=>`<div class="tile"><span class="k">0${i+1}</span><h3>${a[0]}</h3><p>${a[1]}</p></div>`).join('')}

S(2,'風險與權益 · 最容易吃虧的一題','「工作時間」到底怎麼認定？',`
 <div class="grid g2">
  <div class="tile"><span class="k">RULE</span><h3>判斷原則</h3><p>在雇主的<span class="hl">指揮監督之下、不能自由運用</span>的時間，原則上就是工作時間。</p><ul class="dots"><li>待命、等候派案而不能離開</li><li>機構要求提早到場準備</li><li>機構召集的會議、在職訓練</li></ul></div>
  <div class="tile"><span class="k">EVIDENCE</span><h3>出勤紀錄就是你的證據</h3><ul class="dots"><li>雇主應逐日記載出勤至分鐘為止，並保存五年</li><li>勞工可以要求提供出勤紀錄副本</li><li>自己也留一份：打卡 APP 截圖、簽到表照片、回報訊息</li><li>薪資明細要留存，核對時數與加班費</li></ul></div>
 </div>
 <div class="tile solid" style="flex:0 0 auto"><h3>爭議發生時，看的是紀錄，不是記憶</h3><p>你以為記得很清楚的那一天，半年後只會剩下一句「好像是那時候」。每天花兩分鐘寫下時間與異常，這是最便宜的保險。</p></div>`,{wide:true});

S(2,'風險與權益 · 性騷擾舉證','性騷擾怎麼舉證？在案家、對主管、事後才說都可以',`
 <div class="grid g3">
  <div class="tile"><span class="k">當天</span><h3>當下或當天就留</h3><ul class="dots"><li>寫下時間、地點、對方原話和動作、在場的人</li><li>LINE、簡訊、通話紀錄截圖，不要刪</li><li>傳訊息給信任的人或督導說經過，訊息時間就是證據</li><li>你是對話的一方，為保護自己錄音不違法；只交給機構、申訴單位或警察，不要外流</li></ul></div>

S(2,'風險與權益 · 法定通報','看到長輩、身障者被虐待或疏忽：你有通報責任',`
 <div class="grid g3">
  <div class="tile"><span class="k">老人保護</span><h3>老人福利法 §43</h3><p>執行老人福利業務的人員，知道長輩疑似被家人或扶養義務人<b>疏忽、虐待、遺棄</b>，或<b>無人扶養</b>而有危險，要通報縣市政府。</p><p>辦法規定：知悉後 <b>24 小時內</b>通報。</p></div>
  <div class="tile"><span class="k">身障保護</span><h3>身心障礙者權益保障法 §76</h3><p><b>身障服務人員</b>本來就是責任通報人員；衛福部 112 年函釋：<b>長照服務人員也是</b>。發現遺棄、身心虐待、限制自由、放在危險環境等，立即通報，<b>最慢 24 小時</b>。</p></div>
  <div class="tile"><span class="k">家暴、兒少</span><h3>家暴法 §50、兒少法 §53</h3><p>服務對象的家裡有家庭暴力、兒少受虐，撥 <b>113</b>，任何人都可以通報。</p><p>責任通報人員沒依法通報，可罰 6 千～3 萬元（家暴法 §62、兒少法 §100）。</p></div>
 </div>
 <div class="tile solid" style="flex:0 0 auto"><h3>通報不會洩密，也不用怕被找麻煩</h3><p>通報人身分依法保密（老福法 §43、身權法 §76）。長照人員要保守業務秘密，但「依法律規定」通報不在此限（長照法 §20）。</p></div>
 <div class="src">資料來源：老人福利法 §41～§43；老人保護通報及處理辦法；身心障礙者權益保障法 §75、§76；衛生福利部衛部護字第 1121460002 號函；家庭暴力防治法 §50、§62；兒童及少年福利與權益保障法 §53、§100；長期照顧服務法 §20、§44（全國法規資料庫）。</div>`,{wide:true});

 {q:'在案家被抓傷，只是擦傷、沒住院。看醫生的部分負擔可以免繳嗎？',o:['不行，只有住院才有','可以，拿職業傷病門診單就醫','要先自費，年底再申請'],a:1,e:'門診、急診、藥費的部分負擔都免繳，換藥回診也算。這一站教你怎麼拿。'},
 {q:'因職災請公傷病假，薪水怎麼算？',o:['不給薪','半薪','原領工資全額補償','用特休抵'],a:2,e:'公傷病假由雇主按原領工資補償，不能扣全勤。'},
 {q:'懷疑自己的慢性腰痛跟工作有關，要掛哪一科做評估？',o:['骨科','家醫科','職業醫學科','復健科'],a:2,e:'一般骨科門診不會做職業病評估，要掛職業醫學科。'}],{pre:true});

S(4,'受傷之後 · 處理流程','事故發生後的黃金五步驟',`
 <div class="flow">
  ${[['1','確保安全','先讓自己與個案脫離危險，必要時求救或報警'],['2','立即通報','通報督導或單位主管，不要自己判斷「應該還好」'],['3','就醫','就醫時主動說明「這是工作中受的傷」'],['4','留存證據','時間、地點、經過、在場證人、照片、對話紀錄'],['5','申請與追蹤','依機構流程申請職災給付，並持續回診追蹤']].map((a,i)=>`${i?'<div class="ar">›</div>':''}<div class="st"${i===1?' style="background:var(--cc);color:#fff"':''}><span class="k"${i===1?' style="color:#fff"':''}>${a[0]}</span><h3>${a[1]}</h3><p>${a[2]}</p></div>`).join('')}
 </div>
 <div class="note">最常見的錯誤是跳過第 2 步。少了通報紀錄，之後很難證明這是職業傷害。</div>`,{wide:true});

S(4,'受傷之後 · 實際操作','職業傷病門診單怎麼拿？',`
 <div class="flow" style="flex:0 0 auto">
  ${[['1','通報','受傷當下通知督導，說明時間、地點、經過'],['2','取得表單','由投保單位或自己至勞保局網站下載（住院另有申請書）'],['3','機構填蓋章','填寫事故經過，蓋單位章、負責人章、經辦人章'],['4','就醫','出示門診單＋健保卡＋身分證件，免繳部分負擔']].map((a,i)=>`${i?'<div class="ar">›</div>':''}<div class="st"><span class="k">${a[0]}</span><h3>${a[1]}</h3><p>${a[2]}</p></div>`).join('')}
 </div>
 <div class="grid g2">
  <div class="tile"><h3>機構不給怎麼辦</h3><p>投保單位未依規定填發時，可直接向勞保局或各地辦事處請領，查明屬實後發給。就算機構沒幫你加保，只要受僱於登記有案的事業單位，仍可自行申請。</p></div>
  <div class="tile"><h3>來不及拿就先去看了</h3><p>先自費就醫，就醫之日起 <b>10 日內</b>或出院前補送門診單，可退還費用；因不可歸責的事由未能補送，可在 <b>6 個月內</b>附診斷書向勞保局申請核退。</p></div>
 </div>`,{wide:true});

S(4,'受傷之後 · 最常被放棄的權利','只是擦傷、沒住院，有什麼？',`
 <div class="grid g3">
  <div class="tile"><span class="k">醫藥費</span><span class="big" style="font-size:70px;font-family:var(--fh);font-weight:400;color:var(--ok)">有</span><p>拿職業傷病門診單就醫，門診、急診、藥費的部分負擔免繳，由勞保局支付。換藥、回診都算。</p></div>
  <div class="tile"><span class="k">那幾天的薪水</span><span class="big" style="font-size:70px;font-family:var(--fh);font-weight:400;color:var(--ok)">有</span><p>請公傷病假，雇主按原領工資補償。不能算病假、不能扣全勤，也不能要你用特休去抵。</p></div>
  <div class="tile"><span class="k">勞保傷病給付</span><span class="big" style="font-size:70px;font-family:var(--fh);font-weight:400;color:var(--bad)">通常沒有</span><p>要全日不能工作 4 日以上才符合請領條件，且從第 4 日起才發。休一兩天領不到。</p></div>
 </div>
 <div class="tile solid" style="flex:0 0 auto"><p>就算只是擦傷，也要通報、也要拿診斷書。傷口後來感染，或過幾天才發作，要證明「這是那天在案家受的傷」，靠的就是當初那張紙。</p></div>`,{wide:true});

S(4,'受傷之後 · 關鍵差異','職業災害　vs　普通傷病',`
 <table class="tbl">
  <tr><th></th><th>普通傷病</th><th>職業災害</th></tr>
  ${[['醫藥費','自付健保部分負擔','免部分負擔，由勞保局支付'],['勞保現金給付','要住院才有；第 4 日起 50%','門診也算；第 4 日起前 60 日全額'],['雇主給薪','半薪（30 日內）','原領工資全額補償'],['假別','普通傷病假','公傷病假'],['解僱保護','無特別限制','醫療期間雇主不得終止契約']].map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td><b>${r[2]}</b></td></tr>`).join('')}
 </table>
 <div class="note">差距這麼大，所以在案家之間摔車、搬個案扭到腰，不要自己先歸類成「我運氣不好」。</div>`,{wide:true});

S(4,'受傷之後 · 實務對照','各種假，誰給薪？',`
 <table class="tbl">
  <tr><th>假別</th><th>額度</th><th>工資</th></tr>
  ${[['公傷病假','治療、休養期間','全薪　雇主按原領工資補償'],['普通傷病假','未住院 30 日／年','半薪（30 日內）'],['特別休假','依年資','全薪'],['生理假','每月 1 日','半薪'],['事假','14 日／年','不給薪'],['家庭照顧假','7 日／年，併入事假計算','不給薪'],['婚假 / 喪假','婚 8 日；喪 3 / 6 / 8 日','全薪']].map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('')}
 </table>
 <div class="note">同樣休五天，職災是全薪、普通傷病是半薪：差一半。所以「這次算不算職災」一定要認真判斷。</div>`,{wide:true});

S(4,'受傷之後 · 最難的一關','職業病要怎麼證明？',`
 <div class="flow" style="flex:0 0 auto">
  ${[['1','疾病確診','要有明確的病名與診斷'],['2','暴露證據','做什麼、做多久、多重、多頻繁'],['3','時序合理','先有暴露才發病，且符合醫學上的潛伏期'],['4','因果與排除','文獻支持此暴露會致病，並衡量其他非職業因素']].map((a,i)=>`${i?'<div class="ar">›</div>':''}<div class="st"><span class="k">${a[0]}</span><h3>${a[1]}</h3><p>${a[2]}</p></div>`).join('')}
 </div>
 <div class="grid g2">
  <div class="tile solid"><h3>要掛職業醫學科</h3><p>一般骨科或家醫科門診不會做職業病評估。要到設有職業醫學科的醫院，或職安署認可的職業傷病診治專責及網絡醫院，由職業醫學科醫師做工作內容分析與診斷。</p></div>
  <div class="tile"><h3>平常就要留的東西</h3><p>歷年健檢報告（證明到職時正常）、出勤與排班紀錄、服務紀錄（一天搬幾個人、幾戶、有無臥床個案）、歷次就醫病歷與診斷書。看診時帶去，比你講十句有用。</p></div>
 </div>`,{wide:true});

S(4,'官方窗口 ①','北、中、南區職業安全衛生中心',`

  <div class="col" style="flex:0 0 600px">
   <div class="grid g2">${[['北區中心','(02) 8995-6700'],['中區中心','(04) 2255-0633'],['南區中心','(07) 235-4861'],['申訴專線','1955']].map(a=>`<div class="tile"><span class="k">${a[0]}</span><span class="big" style="white-space:nowrap;font-size:${a[1].length>5?30:64}px">${a[1]}</span></div>`).join('')}</div>
  </div>
 </div>
 <div class="tile solid" style="flex:0 0 auto"><p>什麼時候找他們：機構對明顯危害不改善、發生職災卻未依規定通報、勞動條件疑似違法。</p></div>`,{wide:true});

S(4,'官方窗口 ②','職災預防及重建中心　與　職業傷病診治網絡',`
 <div class="grid g2">
  <div class="tile"><span class="k">COPR</span><h3>財團法人職業災害預防及重建中心</h3><p>依職災保險法設立，統籌職災的預防、保護與重建。</p><ul class="dots"><li>職災勞工個案管理服務</li><li>職業傷病診治照護與通報整合</li><li>復工計畫與職能復健協助</li><li>津貼與補助資源的資訊提供</li><li>職場健康臨場服務與技術輔導</li></ul></div>

S(4,'官方窗口 ③ 中部','苗栗、台中、彰化、南投、雲林：找中區辦公室',`
 <div class="grid g3">

function clockSVG(t){
 let s='<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="#fff" stroke="#22304a" stroke-width="3"/>';
 const num=(n,a,r=34)=>{const x=50+Math.sin(a)*r,y=50-Math.cos(a)*r;return `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" font-size="11" font-family="Fredoka,sans-serif" text-anchor="middle" dominant-baseline="central" fill="#22304a">${n}</text>`;};
 if(t==='crowd'){for(let i=1;i<=12;i++)s+=num(i,(i/12)*Math.PI*1.05-0.2,32);}
 else{for(let i=1;i<=12;i++){if(t==='miss'&&(i===4||i===8||i===9))continue;s+=num(t==='miss'&&i===10?'7':i,i/12*Math.PI*2);}}
 if(t==='none'){s+='<text x="50" y="52" font-size="11" text-anchor="middle" fill="#ef5a5a" font-family="Huninn,sans-serif">11:10</text>';}
 else if(t==='pull'){s+='<line x1="50" y1="50" x2="22" y2="38" stroke="#ef5a5a" stroke-width="4" stroke-linecap="round"/><line x1="50" y1="50" x2="36" y2="26" stroke="#ef5a5a" stroke-width="3" stroke-linecap="round"/>';}
 else{s+='<line x1="50" y1="50" x2="40" y2="30" stroke="#22304a" stroke-width="4" stroke-linecap="round"/><line x1="50" y1="50" x2="74" y2="36" stroke="#22304a" stroke-width="3" stroke-linecap="round"/>';}
 return s+'<circle cx="50" cy="50" r="3" fill="#22304a"/></svg>';

 const fit=()=>{const r=cv.getBoundingClientRect();if(!r.width)return;const img=cv.width?ctx.getImageData(0,0,cv.width,cv.height):null;cv.width=r.width*2;cv.height=r.height*2;ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=5;ctx.strokeStyle='#22304a';};
